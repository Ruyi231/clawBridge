bridge:
  databasePath: ./data/clawbridge.db
  logLevel: info
  maxConcurrency: 1
  deliveryMaxAttempts: 5
  deliveryRetryBaseMs: 1000
  attachmentDirectory: ./data/attachments
  attachmentMaxBytes: 20971520
  # Upload project-local files that Codex explicitly links in its final answer.
  # Images are embedded in the answer card; other files are sent as attachments.
  outputArtifacts:
    enabled: true
    maxFiles: 10

feishu:
  appIdEnv: CLAWBRIDGE_FEISHU_APP_ID
  appSecretEnv: CLAWBRIDGE_FEISHU_APP_SECRET
  allowedOpenIdEnv: CLAWBRIDGE_FEISHU_ALLOWED_OPEN_ID
  directMessagesOnly: true

# Optional mixed text/image/file composer backed entirely by Feishu Bitable.
# ClawBridge only makes outbound OpenAPI requests.
composer:
  enabled: false
  # singleActive works with a native Bitable form and needs no low-code app.
  # The most recently activated topic receives the next form submission.
  # sessionParam supports concurrent forms but requires a low-code page that
  # copies clawbridge_session into the hidden routing field.
  routingMode: singleActive
  formUrl: https://example.feishu.cn/share/base/your-native-form
  appToken: bascn_xxx
  tableId: tbl_xxx
  pollIntervalMs: 5000
  maxFiles: 20
  tokenTtlMinutes: 30
  fields:
    session: ClawBridge会话
    text: 消息内容
    attachments: 附件
    status: 处理状态
    error: 错误信息
  statuses:
    pending: 待处理
    processing: 处理中
    accepted: 已接收
    failed: 失败

codex:
  command: codex
  args: [app-server]
  # Mobile approval cards are not implemented yet, so keep this non-interactive.
  approvalPolicy: never
  sandbox: workspaceWrite
  requestTimeoutMs: 30000
  turnTimeoutMs: 600000

projectManagement:
  # Add only parent directories that this Windows user explicitly wants the bot to manage.
  # Relative paths are resolved from the repository root. An empty list is the safe default.
  allowedRoots: []
  allowCreateDirectory: false
  allowRegisterExisting: false
  # When enabled, every visible local project in Codex Desktop is automatically trusted and
  # synchronized. registerCreatedProjects is an explicit opt-in that adds projects created by
  # the bot to the current Windows user's Desktop state; Desktop may need a restart to refresh.
  codexDesktopProjects:
    enabled: true
    registerCreatedProjects: true

projectsFile: ./config/projects.yaml
